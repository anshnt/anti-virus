name: Windows checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Security and portability regressions
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check web/app.js
      - name: Source distribution
        run: python tools/package_source.py
      - name: Whitespace errors
        run: git diff --check

  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build Windows app and installer
        run: |
          python -m pip install pyinstaller==6.22.3
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
          python tools/build_exe.py --installer
      - name: Packaged app smoke test
        run: python tools/smoke_exe.py
